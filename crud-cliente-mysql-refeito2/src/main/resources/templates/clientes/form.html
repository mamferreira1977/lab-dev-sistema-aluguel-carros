<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f7f7f7; }
        h1 { margin-bottom: 20px; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 720px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; }
        .acoes { margin-top: 20px; }
        button, a { padding: 10px 14px; border-radius: 6px; text-decoration: none; }
        button { background: #1f6feb; color: white; border: none; cursor: pointer; }
        a { background: #ddd; color: #222; margin-left: 10px; }
        .erro { color: #c62828; font-size: 0.9rem; margin-top: 4px; }
        .msg-erro { background: #ffecec; color: #a61b1b; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>
<h1 th:text="${cliente.id == null ? 'Novo Cliente' : 'Editar Cliente'}"></h1>

<div th:if="${mensagemErro}" class="msg-erro" th:text="${mensagemErro}"></div>

<form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
    <input type="hidden" th:field="*{id}">

    <div class="campo">
        <label for="rg">RG</label>
        <input id="rg" type="text" th:field="*{rg}">
        <div class="erro" th:if="${#fields.hasErrors('rg')}" th:errors="*{rg}"></div>
    </div>

    <div class="campo">
        <label for="cpf">CPF</label>
        <input id="cpf" type="text" th:field="*{cpf}">
        <div class="erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
    </div>

    <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" type="text" th:field="*{nome}">
        <div class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
    </div>

    <div class="campo">
        <label for="endereco">Endereço</label>
        <input id="endereco" type="text" th:field="*{endereco}">
        <div class="erro" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}"></div>
    </div>

    <div class="campo">
        <label for="profissao">Profissão</label>
        <input id="profissao" type="text" th:field="*{profissao}">
        <div class="erro" th:if="${#fields.hasErrors('profissao')}" th:errors="*{profissao}"></div>
    </div>

    <div class="campo">
        <label for="entidadeEmpregadora">Entidade Empregadora</label>
        <input id="entidadeEmpregadora" type="text" th:field="*{entidadeEmpregadora}">
        <div class="erro" th:if="${#fields.hasErrors('entidadeEmpregadora')}" th:errors="*{entidadeEmpregadora}"></div>
    </div>

    <div class="campo">
        <label for="rendimentos">Rendimentos</label>
        <input id="rendimentos" type="number" step="0.01" min="0.01" th:field="*{rendimentos}">
        <div class="erro" th:if="${#fields.hasErrors('rendimentos')}" th:errors="*{rendimentos}"></div>
    </div>

    <div class="acoes">
        <button type="submit">Salvar</button>
        <a th:href="@{/clientes}">Cancelar</a>
    </div>
</form>
</body>
</html>
