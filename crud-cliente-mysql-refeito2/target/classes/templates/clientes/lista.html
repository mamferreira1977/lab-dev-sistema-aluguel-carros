<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f7f7f7; }
        h1 { margin-bottom: 20px; }
        .acoes-topo { margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 14px; background: #1f6feb; color: white; text-decoration: none; border-radius: 6px; }
        .btn:hover { background: #1558b0; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #efefef; }
        .msg-ok { background: #e6ffed; color: #116329; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .msg-erro { background: #ffecec; color: #a61b1b; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .acoes a { margin-right: 10px; }
    </style>
</head>
<body>
<h1>CRUD de Clientes</h1>

<div th:if="${mensagemSucesso}" class="msg-ok" th:text="${mensagemSucesso}"></div>
<div th:if="${mensagemErro}" class="msg-erro" th:text="${mensagemErro}"></div>

<div class="acoes-topo">
    <a class="btn" th:href="@{/clientes/novo}">Novo Cliente</a>
</div>

<table>
    <thead>
    <tr>
        <th>RG</th>
        <th>CPF</th>
        <th>Nome</th>
        <th>Endereço</th>
        <th>Profissão</th>
        <th>Entidade Empregadora</th>
        <th>Rendimentos</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.rg}"></td>
        <td th:text="${cliente.cpf}"></td>
        <td th:text="${cliente.nome}"></td>
        <td th:text="${cliente.endereco}"></td>
        <td th:text="${cliente.profissao}"></td>
        <td th:text="${cliente.entidadeEmpregadora}"></td>
        <td th:text="${#numbers.formatDecimal(cliente.rendimentos, 1, 'POINT', 2, 'COMMA')}"></td>
        <td class="acoes">
            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
            <a th:href="@{/clientes/excluir/{id}(id=${cliente.id})}" onclick="return confirm('Deseja realmente excluir este cliente?');">Excluir</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(clientes)}">
        <td colspan="8">Nenhum cliente cadastrado.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
